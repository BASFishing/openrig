name: ollama-test
version: "1.0"
description: Minimal test agent for piloting the ollama runtime adapter — no shared imports/plugins, just one seat's guidance.

defaults:
  runtime: ollama

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: guidance_merge
      required: true
  actions: []
